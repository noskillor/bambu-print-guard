name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository – never give the token more than that.
permissions:
  contents: read

jobs:
  no-third-party-code:
    # Obico (AGPL-3.0) is built from its own repository at install time and must
    # never be committed here – neither source code nor model weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject Obico code and model files
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(ml_api|obico[^/]*)/|\.(onnx|weights|darknet|rknn|pt|pth|tflite)$' || true)
          hits=$(git grep -lIE 'The Spaghetti Detective, Inc\.|Copyright .*Obico|from lib\.detection_model import' -- . ':!README*' ':!CONTRIBUTING.md' ':!.github/workflows/ci.yml' || true)
          if [ -n "$bad$hits" ]; then
            echo "::error::Obico code or model files must not be added to this repository (see CONTRIBUTING.md):"
            printf '%s\n' $bad $hits
            exit 1
          fi
          echo "ok – no third-party Obico code or model files"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ruff pytest pillow
      - run: ruff check .
      - run: pytest -q

  shell-and-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/lxc/install.sh deploy/proxmox/print-guard-ctl.sh
      - run: pip install yamllint
      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" docker-compose.yml .github homeassistant/dashboard homeassistant/packages
      - name: Blueprints (with !input tags)
        run: |
          python - <<'EOF'
          import glob, yaml
          class L(yaml.SafeLoader): pass
          L.add_constructor("!input", lambda l, n: l.construct_scalar(n))
          for f in glob.glob("homeassistant/blueprints/**/*.yaml", recursive=True):
              d = yaml.load(open(f, encoding="utf-8"), Loader=L)
              assert "blueprint" in d and "actions" in d, f
              print("ok", f)
          EOF

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t print-guard ./print_guard
      - run: docker run --rm print-guard python print_guard.py --version
