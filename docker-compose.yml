# bambu-print-guard – Docker Compose setup
#
#   cp config.example.json config/config.json   # then edit it
#   echo "<your HA long-lived token>" > config/ha_token
#   docker compose up -d --build
#
# The "ml" service is built directly from Obico's official repository
# (AGPL-3.0, https://github.com/TheSpaghettiDetective/obico-server).
# Nothing from Obico is stored in this repository.

services:
  ml:
    build:
      context: https://github.com/TheSpaghettiDetective/obico-server.git#release:ml_api
      dockerfile: Containerfile.cpu
    image: print-guard-ml:latest
    restart: unless-stopped

  guard:
    build: ./print_guard
    image: print-guard:latest
    restart: unless-stopped
    depends_on:
      - ml
    volumes:
      - ./config:/config
      - ./data:/data
    ports:
      - "8098:8098"   # Home Assistant fetches alert images + live.jpg from here
