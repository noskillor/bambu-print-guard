# Example dashboard view for bambu-print-guard.
# Dashboard → ⋮ → Edit → ⋮ → Raw configuration editor → paste as an entry under `views:`.
# Replace the entity IDs marked with "# <-" with your own (printer entities from ha-bambulab).
#
# Layout: left = live image (AI view while monitoring, normal camera otherwise), status tiles,
# pause/resume (only the one that fits the printer state) and score history;
# right = last alert and sensitivity sliders (optional, see docs/configuration.md).
title: Print Guard
path: print-guard
icon: mdi:printer-3d-nozzle-alert
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Live
        icon: mdi:printer-3d
        badges:
          - type: entity
            entity: sensor.p1s_print_progress          # <-
            show_icon: true
            color: primary
          - type: entity
            entity: sensor.p1s_remaining_time          # <-
            show_icon: true
      # Normal camera while the guard is not monitoring …
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.print_guard_score
            attribute: active
            state_not: [true, "True", "true"]
        grid_options: { columns: full }
        card:
          type: picture-entity
          entity: camera.p1s_camera                    # <-
          camera_view: live
          show_name: false
          show_state: false
      # … and the annotated AI image while it is.
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.print_guard_score
            attribute: active
            state: [true, "True", "true"]
        grid_options: { columns: full }
        card:
          type: picture-entity
          entity: camera.print_guard_live              # <- Generic camera (http://GUARD:8098/live.jpg)
          camera_view: auto
          show_name: false
          show_state: false
      - type: tile
        entity: sensor.p1s_print_status                # <-
        name: Status
        vertical: true
        grid_options: { columns: 3, rows: 2 }
      - type: tile
        entity: sensor.p1s_current_layer               # <-
        name: Layer
        icon: mdi:layers-triple
        vertical: true
        grid_options: { columns: 3, rows: 2 }
      - type: tile
        entity: sensor.print_guard_score
        name: AI score
        vertical: true
        grid_options: { columns: 3, rows: 2 }
      - type: tile
        entity: sensor.print_guard_score
        name: Smoothed
        icon: mdi:chart-bell-curve
        state_content: [smoothed]
        vertical: true
        grid_options: { columns: 3, rows: 2 }
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.p1s_print_status            # <-
            state: running
        grid_options: { columns: full }
        card:
          type: tile
          entity: button.p1s_pause_printing            # <-
          name: Pause print
          icon: mdi:pause-circle
          color: amber
          hide_state: true
          tap_action:
            action: perform-action
            perform_action: button.press
            target: { entity_id: button.p1s_pause_printing }   # <-
            confirmation: { text: "Pause the print?" }
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.p1s_print_status            # <-
            state: pause
        grid_options: { columns: full }
        card:
          type: tile
          entity: button.p1s_resume_printing           # <-
          name: Resume print
          icon: mdi:play-circle
          color: green
          hide_state: true
          tap_action:
            action: perform-action
            perform_action: button.press
            target: { entity_id: button.p1s_resume_printing }  # <-
      - type: history-graph
        title: AI score – last 8 h
        hours_to_show: 8
        grid_options: { columns: full }
        entities:
          - entity: sensor.print_guard_score
            name: AI score

  - type: grid
    cards:
      - type: heading
        heading: Last alert
        icon: mdi:printer-3d-nozzle-alert
      - type: conditional
        conditions:
          - condition: state
            entity: input_text.print_guard_last_alert  # <- your helper
            state_not: ""
        grid_options: { columns: full }
        card:
          type: picture-entity
          entity: camera.print_guard_alert             # <- Local File camera
          camera_view: auto
          show_name: false
          show_state: false
          tap_action: { action: more-info }
      - type: markdown
        grid_options: { columns: full }
        content: >-
          {% set a = states('input_text.print_guard_last_alert') | from_json(default={}) %}
          {% if a %}### ⚠️ Possible failure {{ a.c }} % · {{ a.ts }}

          | | Layer | Z height |
          |:--|--:|--:|
          | Alert at | {{ a.l }} / {{ a.t }} | |
          | First detected | {{ a.fl }} | {{ a.fz }} mm |
          | ✂️ **Last good** | **{{ a.gl }}** | **{{ a.gz }} mm** |

          To continue: cut the model at **Z {{ a.gz }} mm** in Bambu Studio / Orca
          (Cut tool), print the upper part and glue it on.
          {% else %}<ha-alert alert-type="success">No failure detected – no alert yet.</ha-alert>{% endif %}
      # Optional: needs homeassistant/packages/print_guard_tuning.yaml (sliders, edit switch,
      # undo + defaults scripts). Locked: 6 read-only tiles. "Edit" in the heading unlocks the sliders.
      - type: heading
        heading: Sensitivity
        icon: mdi:tune-variant
        heading_style: subtitle
        badges:
          - type: entity
            entity: input_boolean.print_guard_tuning_edit
            name: Edit
            show_state: true
            state_content: name
            show_icon: true
            icon: mdi:pencil
            color: amber
            tap_action: { action: toggle }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state_not: "on" }]
        grid_options: { columns: 4, rows: 2 }
        card:
          type: tile
          entity: input_number.print_guard_alert_threshold
          name: Alert threshold
          icon: mdi:alarm-light-outline
          vertical: true
          tap_action: { action: none }
          icon_tap_action: { action: none }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state_not: "on" }]
        grid_options: { columns: 4, rows: 2 }
        card:
          type: tile
          entity: input_number.print_guard_frame_threshold
          name: Frame threshold
          icon: mdi:image-filter-center-focus
          vertical: true
          tap_action: { action: none }
          icon_tap_action: { action: none }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state_not: "on" }]
        grid_options: { columns: 4, rows: 2 }
        card:
          type: tile
          entity: input_number.print_guard_hits_needed
          name: Hits of 4
          icon: mdi:counter
          vertical: true
          tap_action: { action: none }
          icon_tap_action: { action: none }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state_not: "on" }]
        grid_options: { columns: 4, rows: 2 }
        card:
          type: tile
          entity: input_number.print_guard_cooldown
          name: Cooldown
          icon: mdi:timer-sand
          vertical: true
          tap_action: { action: none }
          icon_tap_action: { action: none }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state_not: "on" }]
        grid_options: { columns: 4, rows: 2 }
        card:
          type: tile
          entity: input_number.print_guard_warmup_layers
          name: Warm-up layers
          icon: mdi:layers-outline
          vertical: true
          tap_action: { action: none }
          icon_tap_action: { action: none }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state_not: "on" }]
        grid_options: { columns: 4, rows: 2 }
        card:
          type: tile
          entity: input_number.print_guard_safety_layers
          name: Cut safety
          icon: mdi:content-cut
          vertical: true
          tap_action: { action: none }
          icon_tap_action: { action: none }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state: "on" }]
        grid_options: { columns: full }
        card:
          type: entities
          show_header_toggle: false
          state_color: false
          entities:
            - entity: input_number.print_guard_alert_threshold
              name: Alert threshold
            - entity: input_number.print_guard_frame_threshold
              name: Frame threshold
            - entity: input_number.print_guard_hits_needed
              name: Hits needed (of 4)
            - entity: input_number.print_guard_cooldown
              name: Cooldown
            - entity: input_number.print_guard_warmup_layers
              name: Warm-up layers
            - entity: input_number.print_guard_safety_layers
              name: Cut safety layers
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state: "on" }]
        grid_options: { columns: 6 }
        card:
          type: tile
          entity: script.print_guard_tuning_undo
          name: Undo
          icon: mdi:undo
          color: blue
          hide_state: true
          tap_action: { action: perform-action, perform_action: script.print_guard_tuning_undo }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state: "on" }]
        grid_options: { columns: 6 }
        card:
          type: tile
          entity: script.print_guard_tuning_reset
          name: Defaults
          icon: mdi:restore
          color: grey
          hide_state: true
          tap_action:
            action: perform-action
            perform_action: script.print_guard_tuning_reset
            confirmation: { text: "Reset all sliders to the defaults? (Undo can revert it)" }
      - type: conditional
        conditions: [{ condition: state, entity: input_boolean.print_guard_tuning_edit, state: "on" }]
        grid_options: { columns: full }
        card:
          type: markdown
          content: |-
            <details open><summary><b>What do the sliders mean?</b></summary>
            <dl>
            <dt><ha-icon icon="mdi:alarm-light-outline"></ha-icon> <b>Alert threshold</b></dt><dd>How sure the AI must be over several frames before an alert is sent. Higher = fewer false alarms, but later warning.</dd><br>
            <dt><ha-icon icon="mdi:image-filter-center-focus"></ha-icon> <b>Frame threshold</b></dt><dd>When a <i>single</i> frame counts as suspicious.</dd><br>
            <dt><ha-icon icon="mdi:counter"></ha-icon> <b>Hits needed</b></dt><dd>How many of the last 4 frames (≈ 40 s) must be suspicious. Protects against single reflections.</dd><br>
            <dt><ha-icon icon="mdi:timer-sand"></ha-icon> <b>Cooldown</b></dt><dd>Minimum time between two alerts.</dd><br>
            <dt><ha-icon icon="mdi:layers-outline"></ha-icon> <b>Warm-up layers</b></dt><dd>The first layers are ignored – first-layer lines often look like spaghetti to the AI.</dd><br>
            <dt><ha-icon icon="mdi:content-cut"></ha-icon> <b>Cut safety layers</b></dt><dd>Buffer: the suggested <i>last good layer</i> is this many layers below the first detection.</dd>
            </dl>
            <hr>
            <small>Score = sum of AI confidences per frame · clean print ≈ 0 · obvious spaghetti 1–7.<br>False alarms → raise alert threshold or hits needed · missed failures → lower both.</small>
            </details>
