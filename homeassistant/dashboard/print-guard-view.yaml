# Example dashboard view for bambu-print-guard.
# Dashboard → ⋮ → Edit → ⋮ → Raw configuration editor → paste as an entry under `views:`.
# Replace the entity IDs marked with "# <-" with your own.
title: Print Guard
path: print-guard
icon: mdi:printer-3d-nozzle-alert
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Live – what the AI sees
        icon: mdi:brain
      - type: picture-entity
        entity: camera.print_guard_live          # <- Generic camera (still image http://GUARD:8098/live.jpg)
        camera_view: auto
        show_name: false
        show_state: false
        grid_options: { columns: full }
      - type: markdown
        grid_options: { columns: full }
        content: >-
          {% set s = 'sensor.print_guard_score' %}
          {% if state_attr(s, 'active') %}**Monitoring active** · score {{ states(s) }} ·
          smoothed {{ state_attr(s, 'smoothed') }} (alert at {{ state_attr(s, 'alert_threshold') }}) ·
          hits {{ state_attr(s, 'hits') }} · layer {{ state_attr(s, 'layer') }} ·
          updated {{ as_local(states[s].last_updated).strftime('%H:%M:%S') }}
          {% elif states(s) in ['unknown', 'unavailable'] %}No data from the guard yet.
          {% else %}**Monitoring off** – starts automatically with the next print.{% endif %}
      - type: history-graph
        title: AI score (8 h)
        hours_to_show: 8
        entities:
          - entity: sensor.print_guard_score
            name: AI score
        grid_options: { columns: full }
  - type: grid
    cards:
      - type: heading
        heading: Last alert
        icon: mdi:printer-3d-nozzle-alert
      - type: conditional
        conditions:
          - condition: state
            entity: input_text.print_guard_last_alert   # <- your helper
            state_not: ""
        card:
          type: picture-entity
          entity: camera.print_guard_alert              # <- Local File camera
          camera_view: auto
          show_name: false
          show_state: false
        grid_options: { columns: full }
      - type: markdown
        grid_options: { columns: full }
        content: >-
          {% set a = states('input_text.print_guard_last_alert') | from_json(default={}) %}
          {% if a %}### ⚠️ Possible failure {{ a.c }} % – {{ a.ts }}

          | | Layer | Z height |
          |---|---|---|
          | Alert at | {{ a.l }} / {{ a.t }} | |
          | First detected | {{ a.fl }} | {{ a.fz }} mm |
          | ✂️ **Last good** | **{{ a.gl }}** | **{{ a.gz }} mm** |

          To continue: cut the model at **Z {{ a.gz }} mm** in Bambu Studio / Orca
          (Cut tool), print the upper part and glue it on.
          {% else %}No alert stored yet.{% endif %}
      - type: tile
        entity: button.p1s_pause_printing     # <- printer pause button
        name: Pause print
        icon: mdi:pause
        tap_action:
          action: perform-action
          perform_action: button.press
          target: { entity_id: button.p1s_pause_printing }
          confirmation: { text: "Pause the print?" }
        grid_options: { columns: 6 }
      - type: tile
        entity: button.p1s_resume_printing    # <- printer resume button
        name: Resume
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: button.press
          target: { entity_id: button.p1s_resume_printing }
        grid_options: { columns: 6 }
